name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: node --check client.js
      # construct the client so the vendored proto is parsed at load time
      - run: node -e "new (require('./client.js').PromptClient)({host:'localhost:1'})"
